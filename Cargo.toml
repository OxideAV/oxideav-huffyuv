[package]
name = "oxideav-huffyuv"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-huffyuv"
authors = ["Mark Karpeles"]
description = "Pure-Rust HuffYUV / FFVHuff lossless intra-only video decoder for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-huffyuv"
keywords = ["multimedia", "video", "huffyuv", "lossless", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[features]
default = ["registry"]
# Wire the crate's `Decoder` impl + `register(ctx)` entry point into
# `oxideav-core`'s codec registry. Disable for standalone builds that
# want the decoder without dragging in the framework.
registry = ["dep:oxideav-core"]

[dependencies]
oxideav-core = { version = "0.1", optional = true }

[dev-dependencies]
# Test-only dev-dep on the AVI container so we can exercise the
# codec/container interface end-to-end (encode → mux → demux → decode)
# without shadow-implementing AVI walking inside this crate. spec/02
# §1: HuffYUV streams live in AVI `00dc` chunks; the container is
# oxideav-avi's responsibility, not this crate's.
oxideav-avi = "0.0"
oxideav-core = "0.1"
criterion = "0.5"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "roundtrip"
harness = false
